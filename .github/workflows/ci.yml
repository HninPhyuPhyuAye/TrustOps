name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, type-check, and test
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        run: npm run build

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: trustops:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan container for high-impact vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: trustops:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  terraform:
    name: Terraform static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform/environments/reference
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Terraform 1.15.9
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialise without a remote backend
        run: terraform init -backend=false -input=false

      - name: Validate reference configuration
        run: terraform validate
